# Builds the PR's Gradle dependency graph and saves it as an artifact. A PR from a fork or from Dependabot gets
# no write permission, so dependency-review.yml submits and reviews it once this run completes.
name: Dependency graph

on:
  pull_request:

permissions: {}

concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    runs-on: ubuntu-latest
    permissions:
      contents: read # the checkout; no write, so it runs the same on forks and Dependabot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: generate-and-upload
          artifact-retention-days: 1
