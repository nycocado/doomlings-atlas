# Fails a PR that adds a dependency with a known vulnerability, and lists the dependencies it adds in the
# job summary. The PR's Gradle graph comes from dependency-graph.yml through dependency-graph-submit.yml,
# since GitHub can't read Gradle builds by itself; the base's comes from dependency-submission.yml.
name: Dependency review

on:
  pull_request:

permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read # the dependency graph of both commits
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Waits for the PR's graph, which arrives after a Gradle build and a second workflow.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 900
