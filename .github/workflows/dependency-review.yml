# Fails a PR that adds a dependency with a known vulnerability, and lists the dependencies it adds in the
# job summary. The Gradle graph comes from the PR's own dependency submission, since GitHub can't read
# Gradle builds by itself.
name: Dependency review

on:
  pull_request:

permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the dependency submission API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  review:
    needs: submit
    runs-on: ubuntu-latest
    permissions:
      contents: read # the dependency graph of both commits
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The submission of the PR's head can arrive after this job starts.
          retry-on-snapshot-warnings: true
