# Submits the graph dependency-graph.yml saved for a PR, with the write permission the PR's own run doesn't get.
# It never checks out or runs the PR's code: it only uploads the saved graph, so workflow_run is safe here.
name: Dependency graph submission

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Dependency graph]
    types: [completed]

permissions: {}

jobs:
  submit:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read # the graph artifact of the PR's run
      contents: write # the dependency submission API
    steps:
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: download-and-submit
