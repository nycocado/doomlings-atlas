name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows the commit format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|chore|docs|update|media)!?: [^ ]'; then
            echo "::error::PR title must look like 'type: subject' or 'type!: subject' (see CONTRIBUTING.md#commits): $TITLE"
            exit 1
          fi

  no-ai-attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # the sparse checkout of the regex
      pull-requests: read # the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .claude/hooks/ai-attribution.regex
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check the PR body and commits have no AI attribution
        env:
          BODY: ${{ github.event.pull_request.body }}
          COMMITS_URL: ${{ github.event.pull_request.commits_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          messages=$(gh api --paginate "$COMMITS_URL" --jq '.[].commit.message')
          if printf '%s\n%s\n' "$BODY" "$messages" | grep -Eqi "$(cat .claude/hooks/ai-attribution.regex)"; then
            echo "::error::Remove the AI attribution (Co-Authored-By trailer or 'Generated with' footer); see CONTRIBUTING.md#opening-a-pull-request"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # check runs spotlessCheck, lint, unit tests and the permission and glossary checks.
      - run: ./gradlew check assembleDebug validateDebugScreenshotTest
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports
            **/build/outputs/screenshotTest-results

  # R8 and resource shrinking only run in the release build. Without the release key's Gradle properties
  # the APK is built unsigned (app/build.gradle.kts).
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew assembleRelease
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-reports
          path: |
            **/build/reports
            app/build/outputs/mapping
