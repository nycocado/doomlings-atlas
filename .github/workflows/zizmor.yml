# Audits the workflows with zizmor at its default level. Findings go to code scanning, and any finding fails the job.
name: zizmor

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # the SARIF upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # With Advanced Security the action uploads findings but never fails on them, so a second run fails the job.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
      - if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
