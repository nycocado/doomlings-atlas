name: Translation
description: Wrong, missing or awkward text in a language.
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where the text appears and what it says now
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
