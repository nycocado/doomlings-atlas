name: Spec
description: A feature or change, specified well enough to build. Agents pick it up once the maintainer approves it.
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: The problem, from the player's or contributor's point of view.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: The solution, from the same point of view.
    validations:
      required: true
  - type: textarea
    id: stories
    attributes:
      label: User stories
      description: 'Numbered: "As a <actor>, I want <feature>, so that <benefit>." Cover every aspect of the change.'
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Implementation decisions
      description: Modules touched, interfaces, data formats, ADRs that apply. No file paths or code; they go stale. For a refactor, say "no behavior change", not "no app code changes".
  - type: textarea
    id: testing
    attributes:
      label: Testing decisions
      description: What gets tested, at which seam and with which kind of test (docs/testing.md), and similar tests to follow.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: notes
    attributes:
      label: Further notes
      description: Open questions go here; card data is never guessed.
