name: Ticket
description: A change worked out well enough to build, as one PR, or a spec that splits into tickets. Agents pick it up once the maintainer approves it.
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing, from the player's or contributor's point of view. A ticket of a spec starts with "Part of #N" and adds only what its slice needs.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Decided behavior
      description: What happens once it is done, with every decision already made. In a spec, the decisions its tickets share; in a ticket of a spec, only its own slice.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable, one per line, including the test that must fail before the change and where it goes (docs/testing.md). For a refactor, say "no behavior change", not "no app code changes".
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Only what a builder would be tempted to do too.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Implementation decisions (modules, ADRs that apply; no file paths or code, they go stale) and open questions. Card data is never guessed.
