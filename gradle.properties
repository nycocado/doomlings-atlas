org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
android.experimental.enableScreenshotTest=true
# Sets shipped in the APK: every set folder of assets/doomlings.
atlas.enabledSets=classic,overlush,upgrade,imaginary-ends,castle-glass,legends-of-enderas,mokoko-village,nightflower-island,shadow-puppets,special
# Card types shipped in the APK: every type in the card data.
atlas.enabledTypes=trait,age,catastrophe,birth-of-life,gene-pool,meaning-of-life,trinket,treasure,merchant
