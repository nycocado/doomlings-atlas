org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
android.experimental.enableScreenshotTest=true
# Sets shipped in the APK. The rest of assets/doomlings stays in the repo until its data is checked.
atlas.enabledSets=classic
# Card types the app uses.
atlas.enabledTypes=trait,age,catastrophe,birth-of-life,gene-pool,meaning-of-life,trinket,treasure,merchant
