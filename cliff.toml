# Changelog and GitHub Release notes from the squash commits on main (CONTRIBUTING.md#commits).

[changelog]
header = """
# Changelog

Notable changes in each release of Doomlings Atlas, generated from the commit history by [git-cliff](https://git-cliff.org).\n
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_preprocessors = [
  # git-cliff reads types in the Conventional Commits form, "type: subject".
  { pattern = '^\[(\w+)\] ', replace = '${1}: ' },
  { pattern = '\(#([0-9]+)\)', replace = '([#${1}](https://github.com/nycocado/doomlings-atlas/pull/${1}))' },
]
# The comments only order the groups; the template strips them.
commit_parsers = [
  # The release PR only updates this changelog.
  { message = "^docs: ([Rr]elease v[0-9]|[Cc]hangelog for [0-9])", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^update", group = "<!-- 3 -->Card Data" },
  { message = "^media", group = "<!-- 4 -->Media" },
  { message = "^refactor", group = "<!-- 5 -->Refactoring" },
  { message = "^docs", group = "<!-- 6 -->Documentation" },
  { message = "^chore", group = "<!-- 7 -->Tooling" },
]
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
